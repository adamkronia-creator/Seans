<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#FFFFFF" />
    <!-- Приложение только светлое (тёмной темы нет по решению заказчика). Без этого «Затемнять сайты» в Chrome и браузерах с принудительной тёмной темой
         перекрашивают экраны сами: чёрные шапки, тёмное стекло, серые подписи на тёмном фоне -->
    <meta name="color-scheme" content="only light" />
    <!-- Веб-приложение на весь экран. Строку состояния iOS не перекрашиваем (black-translucent): значки у неё белые, а шапки светлые;
         приложение и так рисуется до краёв экрана (viewport-fit=cover), а шапки и нижние панели сами отступают на безопасные зоны -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Сеанс" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <title>Сеанс</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
